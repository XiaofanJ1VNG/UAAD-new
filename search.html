<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | UAAD</title><link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f6f6f3;font-family:'Wix Madefor Display',Arial,sans-serif}a{color:inherit;text-decoration:none}main{padding:155px 4vw 120px;min-height:75vh}h1{font-size:clamp(64px,9vw,140px);font-weight:500;letter-spacing:-.075em;line-height:.95;margin:0 0 36px}.search-form{display:flex;gap:12px;max-width:780px;margin-bottom:36px}.search-form input,.search-form button{border:0;border-radius:999px;font:inherit;padding:17px 23px}.search-form input{flex:1;min-width:0;background:#252525;color:#fff}.search-form button{background:#f6f6f3;color:#111;cursor:pointer}.search-form button:hover{background:#d2ff39}.status{color:#999;font-size:14px;margin:0 0 40px}.result{display:block;border-top:1px solid #333;padding:27px 0}.result:last-child{border-bottom:1px solid #333}.result-type{font-size:12px;color:#999;margin-bottom:12px}.result h2{font-size:clamp(25px,3vw,43px);line-height:1.12;font-weight:500;letter-spacing:-.04em;margin:0 0 14px}.result:hover h2{color:#d2ff39}.result p{max-width:850px;color:#aaa;font-size:16px;line-height:1.5;margin:0}mark{background:transparent;color:#d2ff39}.empty{color:#aaa;padding:30px 0;font-size:20px}@media(max-width:650px){main{padding:125px 20px 90px}.search-form{gap:8px}.search-form input,.search-form button{padding:15px 18px}}
</style></head><body data-page="search"><header class="site-header" id="site-header"></header><main><h1>Search</h1><form class="search-form" action="search.html"><input id="query" name="q" type="search" placeholder="Search UAAD" aria-label="Search UAAD"><button type="submit">Search ↗</button></form><p class="status" id="status" role="status"></p><div id="results"></div></main><footer class="site-footer" id="site-footer"></footer><script src="shared.js"></script><script>
const query=new URLSearchParams(location.search).get('q')?.trim()||'',input=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results');input.value=query;
const normalize=s=>String(s||'').normalize('NFKC').toLowerCase();
function searchable(value){if(value==null)return '';if(Array.isArray(value))return value.map(searchable).join(' ');if(typeof value==='object')return Object.entries(value).filter(([k])=>!['src','image','headshot','html','url','slug','cover'].includes(k)).map(([,v])=>searchable(v)).join(' ');return String(value)}
function rank(item,tokens){const text=normalize(item.text),title=normalize(item.title);return tokens.every(t=>text.includes(t))?tokens.reduce((n,t)=>n+(title.includes(t)?10:1),0):0}
function snippet(text,tokens){text=text.replace(/\s+/g,' ').trim();const lower=normalize(text),i=Math.max(0,...tokens.map(t=>lower.indexOf(t)));const start=Math.max(0,i-70);return (start?'…':'')+text.slice(start,start+240)+(text.length>start+240?'…':'')}
async function read(url,json=false){const r=await fetch(url);if(!r.ok)throw Error(url);return json?r.json():r.text()}
async function search(){if(!query){status.textContent='Search programs, stories, and information about UAAD.';return}status.textContent='Searching…';const tokens=normalize(query).split(/\s+/).filter(Boolean);const sources=await Promise.allSettled([read('programs.json',true),read('stories.json',true),...['index.html','about.html','collaboration.html'].map(u=>read(u))]);let index=[];
if(sources[0].status==='fulfilled')index.push(...sources[0].value.map(p=>({title:p.title,type:p.section==='Publications'?'Publication':'Program',url:p.section==='Publications'?p.url:'program-item.html?slug='+encodeURIComponent(p.slug),text:searchable(p),summary:p.introduction||p.description||searchable(p.artists)})));
if(sources[1].status==='fulfilled')index.push(...sources[1].value.map(s=>({title:s.title,type:'Story',url:'story.html?slug='+encodeURIComponent(s.slug),text:searchable(s),summary:(s.body||[]).map(b=>b.text||b.caption||'').join(' ')||s.excerpt||s.title})));
const pages=[['Home','index.html'],['About','about.html'],['Collaboration','collaboration.html']];sources.slice(2).forEach((r,i)=>{if(r.status!=='fulfilled')return;const doc=new DOMParser().parseFromString(r.value,'text/html');doc.querySelectorAll('script,style,header,footer,nav').forEach(n=>n.remove());const text=(doc.querySelector('main')||doc.body).textContent;index.push({title:pages[i][0],type:'Page',url:pages[i][1],text:pages[i][0]+' '+text,summary:text})});
const matches=index.map(item=>({...item,score:rank(item,tokens)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);const failed=sources.filter(r=>r.status==='rejected').length;status.textContent=matches.length+' '+(matches.length===1?'result':'results')+' for “'+query+'”'+(failed?' · Some content could not be loaded.':'');results.replaceChildren();if(!matches.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=failed?'Some content is unavailable. Try again after refreshing.':'No results found. Try another keyword.';results.append(empty);return}matches.forEach(item=>{const a=document.createElement('a');a.className='result';a.href=item.url;const label=document.createElement('div');label.className='result-type';label.textContent=item.type;const h=document.createElement('h2');h.textContent=item.title+' ↗';const p=document.createElement('p');p.textContent=snippet(item.summary||item.text,tokens);a.append(label,h,p);results.append(a)})}
search().catch(()=>{status.textContent='Search is unavailable. Please try again.'});
</script></body></html>
