gin-top:10px}.entry-arrow{font-size:22px;color:#aaa}.preview{position:sticky;top:92px;align-self:start;max-height:calc(100svh - 104px);overflow-y:auto;scrollbar-width:none;padding:0 0 12px}.preview::-webkit-scrollbar{display:none}.preview-frame{height:min(43svh,400px);min-height:220px;position:relative;background:#151515;overflow:hidden;display:grid;place-items:center}.preview-frame img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .4s ease}.preview-frame img.visible{opacity:1}.preview-fallback{max-width:85%;font-size:clamp(28px,3.5vw,55px);font-weight:500;letter-spacing:-.07em;text-align:center;line-height:1.02}.preview-info{margin-top:17px;color:#aaa;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.preview-title{font-size:clamp(23px,2.3vw,35px);line-height:1.1;letter-spacing:-.055em;margin:12px 0}.preview-desc{font-size:13px;line-height:1.5;color:#aaa;margin:8px 0}.preview-link{display:inline-block;margin-top:15px;border:1px solid #777;border-radius:999px;padding:10px 17px;font-size:12px}.preview-link:hover{background:#f6f6f3;color:#111}.preview-link[hidden]{display:none}.empty{padding:60px 0;color:#aaa}.mobile-cover{display:none}

</style><link rel="stylesheet" href="shared.css"></head><body data-page="program"><header class="site-header" id="site-header"></header><main><div class="heading"><h1>Programs</h1><p>Events, virtual exhibitions, and publications from the UAAD archive.</p></div><div class="toolbar"><div class="filters" id="filters" aria-label="Filter programs"></div><span class="count" id="count"></span></div><div class="layout"><div class="archive" id="archive" aria-live="polite"></div><aside class="preview" aria-label="Program preview"><div class="preview-frame"><div class="preview-fallback" id="previewFallback"></div><img id="previewA" alt=""><img id="previewB" alt=""></div><div class="preview-info" id="previewInfo"></div><div class="preview-title" id="previewTitle"></div><p class="preview-desc" id="previewDescription"></p><a class="preview-link" id="previewLink" href="#" target="_blank" rel="noopener noreferrer">View project ↗</a></aside></div></main><footer class="site-footer" id="site-footer"></footer><script src="shared.js"></script><script>
const sections=['All','IRL','Virtual','Publications'];let items=[],section='All',current=null,active=-1;const archive=document.getElementById('archive'),filters=document.getElementById('filters'),images=[document.getElementById('previewA'),document.getElementById('previewB')],search=document.getElementById('search');search.placeholder='⌕  Search programs';search.setAttribute('aria-label','Search programs');search.value=new URLSearchParams(location.search).get('q')||'';
let loadToken=0;
function programCover(p){return typeof p.cover==='string'?{src:p.cover,alt:p.title}:p.cover&&p.cover.src?p.cover:null}
function projectLink(p){return p.section==='Publications'?p.url:'program-item.html?slug='+encodeURIComponent(p.slug)}
function preview(p){if(current===p)return;current=p;const token=++loadToken;images.forEach(img=>img.classList.remove('visible'));active=-1;document.getElementById('previewFallback').textContent=p.title;const cover=programCover(p);if(cover){const img=images[0];img.onload=()=>{if(token===loadToken)img.classList.add('visible')};img.onerror=()=>{if(token===loadToken)img.classList.remove('visible')};img.alt=cover.alt||p.title;img.src=cover.src}document.getElementById('previewInfo').textContent=p.date+' · '+(p.venue||'UAAD');document.getElementById('previewTitle').textContent=p.title;document.getElementById('previewDescription').textContent=p.description||p.tags.join(' · ');document.getElementById('previewLink').href=projectLink(p);document.querySelector('.preview').scrollTop=0}
function render(){archive.replaceChildren();current=null;const q=search.value.trim().toLowerCase();const shown=items.filter(p=>(section==='All'||section===p.section)&&[p.title,p.date,p.venue,p.description,...p.tags].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=shown.length+' '+(shown.length===1?'Program':'Programs');if(!shown.length){archive.append(Object.assign(document.createElement('div'),{className:'empty',textContent:'No programs found.'}));return}const groups=section==='All'?sections.slice(1):[section];groups.forEach(group=>{const rows=shown.filter(p=>p.section===group);if(!rows.length)return;const wrapper=document.createElement('section');wrapper.className='group';const h=document.createElement('h2');h.className='group-title';h.textContent=group;wrapper.append(h);let lastYear='';rows.forEach(p=>{const year=(p.date.match(/20\d{2}/)||[''])[0];if(year!==lastYear){const label=document.createElement('div');label.className='year';label.textContent=year;wrapper.append(label);lastYear=year}const row=document.createElement('button');row.type='button';row.className='entry';row.innerHTML='<span class="date"></span><span class="entry-body"><span class="entry-title"></span><span class="entry-meta"></span></span><span class="entry-arrow" aria-hidden="true">↗</span>';row.querySelector('.date').textContent=p.date.replace(/,?\s*20\d{2}/,'');row.querySelector('.entry-title').textContent=p.title;row.querySelector('.entry-meta').textContent=[p.venue,...p.tags].filter(Boolean).join(' · ');if(programCover(p)){const photo=document.createElement('img');photo.className='mobile-cover';photo.src=programCover(p).src;photo.alt=programCover(p).alt||p.title;photo.loading='lazy';photo.onerror=()=>photo.remove();row.querySelector('.entry-body').append(photo)}row.setAttribute('aria-label',p.title+' (opens project)');row.addEventListener('mouseenter',()=>preview(p));row.addEventListener('focus',()=>preview(p));row.addEventListener('click',()=>{location.href=projectLink(p)});wrapper.append(row)});archive.append(wrapper)});preview(shown[0])}
sections.forEach(name=>{const button=document.createElement('button');button.type='button';button.textContent=name;button.setAttribute('aria-pressed',String(name===section));button.addEventListener('click',()=>{section=name;filters.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()});filters.append(button)});search.addEventListener('input',render);fetch('programs.json').then(r=>{if(!r.ok)throw Error('Programs unavailable');return r.json()}).then(data=>{items=data;render()}).catch(()=>{archive.innerHTML='<div class="empty">Could not load programs.json. Preview through a local server or GitHub Pages.</div>'});
</script></body></html>
